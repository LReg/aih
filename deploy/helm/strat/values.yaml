# Base/shared defaults for every environment, same split as planning-poker's chart
# (state/wanted-state/06-migration-runbook.md, Phase 1/2) — ingress.host and anything else
# that differs per environment is deliberately NOT set here, it lives in the infra repo's
# own deploy/helm/strat/values.yaml, merged on top of this one by the Argo CD Application.
# image.tag is the one exception, bumped by ghcr-dev-continuous.yml on every push to main
# in this same repo.
#
# mongo below points at the shared in-cluster MongoDB instance (infra repo's
# deploy/k8s/databases/mongodb/), same host/user/database/credentialsSecretName shape as
# musik-star's chart — stays empty here, set per-environment in infra. seaweedfs is unused
# dead config (never read anywhere in backend/src), left in place, out of scope for the
# Zitadel migration. lldap is gone: Zitadel is now the identity provider, see
# state/wanted-state/03-auth-zitadel.md.

replicaCount: 1

image:
  registry: ghcr.io/lreg
  pullPolicy: IfNotPresent
  tag: "6780fc9"
  frontend:
    repository: aih-frontend
  backend:
    repository: aih-backend

# Set per-environment in infra.
ingress:
  host: ""
  # websecure: { certResolver: HttpsResolver }   # left absent — adds a second, separate
  # IngressRoute for websecure once set. web's own IngressRoute never carries a tls block,
  # so it's unaffected either way — see templates/ingressroute.yaml's file-level comment.

# Zitadel's hostname (no scheme — AuthGuard builds https://$AUTH_DOMAIN/oidc/v1/userinfo
# itself) and this app's own project/client id in it, see 03-auth-zitadel.md.
auth:
  domain: ""
  clientId: ""

backend:
  port: "8080"
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  features:
    sso: true

# Shared instance (see the file-level comment above). credentialsSecretName holds a single
# "password" key — MONGO_URI is assembled from these plus that password via Kubernetes'
# $(VAR) env expansion in backend-deployment.yaml, same trick musik-star's chart uses.
mongo:
  host: ""
  user: ""
  database: ""
  credentialsSecretName: ""

seaweedfs:
  masterUrl: ""
  volumeUrl: ""

# A SealedSecret (infra repo's deploy/k8s/strat/app-secrets.sealed.yaml), not hand-created
# — planning-poker's own by-hand appSecretsName predates the Sealed Secrets workflow this
# repo now uses for every app (manual-exec/sealed-secrets/). Keys expected:
# credential-encryption-key, ai-hub-api-key.
appSecretsName: strat-secrets
