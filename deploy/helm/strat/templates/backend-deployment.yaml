apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "strat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: strat
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strat
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      # AUTH_DOMAIN (Zitadel) is called over HTTPS at runtime, so a trailing dot on the
      # hostname isn't an option (breaks TLS hostname verification) — same ndots:5
      # resolv.conf search-domain bug musik-star/ai-tracker both hit, confirmed not
      # specific to Alpine/musl. ndots:1 makes any dotted name resolve absolute-first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.image.backend.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: DOMAIN
              value: {{ .Values.ingress.host | quote }}
            - name: AUTH_DOMAIN
              value: {{ .Values.auth.domain | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.clientId | quote }}
            - name: FRONTEND_URL
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.credentialsSecretName }}
                  key: password
            - name: MONGO_URI
              value: {{ printf "mongodb://%s:$(MONGO_PASSWORD)@%s/%s?authSource=%s" .Values.mongo.user .Values.mongo.host .Values.mongo.database .Values.mongo.database | quote }}
            - name: SEAWEEDFS_MASTER_URL
              value: {{ .Values.seaweedfs.masterUrl | quote }}
            - name: SEAWEEDFS_VOLUME_URL
              value: {{ .Values.seaweedfs.volumeUrl | quote }}
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecretsName }}
                  key: credential-encryption-key
            - name: AI_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appSecretsName }}
                  key: ai-hub-api-key
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
